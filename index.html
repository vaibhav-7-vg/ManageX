<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#5B4BDB"
  >

  <meta
    name="description"
    content="ManageX — Manage your business. Your way."
  >

  <title>ManageX</title>

  <!-- ManageX stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ==================================================
       MANAGEX APPLICATION ROOT
       ================================================== -->

  <div id="app">

    <!-- HEADER -->
    <header class="app-header">

      <div class="brand">

        <div class="brand-logo">
          MX
        </div>

        <div class="brand-name">
          Manage<span>X</span>
        </div>

      </div>

    </header>


    <!-- MAIN CONTENT -->
    <main class="main-content">

      <section class="welcome-card">

        <div class="eyebrow">
          BUSINESS MANAGEMENT
        </div>

        <h1>
          ManageX
        </h1>

        <p class="tagline">
          Manage your business. Your way.
        </p>

        <button
          id="startBtn"
          class="primary-button"
          type="button"
        >
          Get Started
        </button>

      </section>

    </main>

  </div>


  <!-- ManageX application JavaScript -->
  <script src="app.js"></script>

</body>
</html>
