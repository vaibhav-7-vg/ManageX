<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#5B4BDB"><title>ManageX</title><link rel="stylesheet" href="style.css"></head><body>
<section id="setupPage" class="setup-page"><div class="setup-brand"><div class="mx-logo">M</div><h1>ManageX</h1><p>Manage your business. Your way.</p></div><div class="setup-progress"><div id="progressBusiness" class="progress-step active"><span>1</span><b>Business</b></div><div class="progress-line"></div><div id="progressDetails" class="progress-step"><span>2</span><b>Details</b></div></div><div id="businessStep" class="setup-card"><p class="eyebrow">GET STARTED</p><h2>Choose your business</h2><p class="muted">ManageX adapts to the way your business works.</p><div id="businessTypeGrid" class="business-type-grid"><button type="button" class="business-type-card" data-business-type="general-store"><span class="business-icon">GS</span><strong>General Store</strong><small>Daily essentials</small></button><button type="button" class="business-type-card" data-business-type="supermarket"><span class="business-icon">SM</span><strong>Supermarket</strong><small>Grocery & retail</small></button><button type="button" class="business-type-card" data-business-type="clothing"><span class="business-icon">CL</span><strong>Clothing</strong><small>Fashion & apparel</small></button><button type="button" class="business-type-card" data-business-type="electronics"><span class="business-icon">EL</span><strong>Electronics</strong><small>Devices & accessories</small></button><button type="button" class="business-type-card" data-business-type="restaurant"><span class="business-icon">RC</span><strong>Restaurant / Cafe</strong><small>Food & beverages</small></button><button type="button" class="business-type-card" data-business-type="salon"><span class="business-icon">SB</span><strong>Salon / Beauty</strong><small>Beauty services</small></button><button type="button" class="business-type-card" data-business-type="tailoring"><span class="business-icon">TS</span><strong>Tailoring</strong><small>Stitching & alterations</small></button><button type="button" class="business-type-card" data-business-type="mobile-shop"><span class="business-icon">MS</span><strong>Mobile Shop</strong><small>Phones & accessories</small></button><button type="button" class="business-type-card" data-business-type="hardware"><span class="business-icon">HW</span><strong>Hardware</strong><small>Tools & materials</small></button><button type="button" class="business-type-card" data-business-type="automobile"><span class="business-icon">AU</span><strong>Automobile</strong><small>Vehicle services</small></button><button type="button" class="business-type-card" data-business-type="repair-service"><span class="business-icon">RS</span><strong>Repair Service</strong><small>Repair & maintenance</small></button><button type="button" class="business-type-card" data-business-type="printing"><span class="business-icon">PR</span><strong>Printing</strong><small>Print & design</small></button><button type="button" class="business-type-card" data-business-type="photography"><span class="business-icon">PH</span><strong>Photography</strong><small>Photo & video</small></button><button type="button" class="business-type-card" data-business-type="fitness"><span class="business-icon">FT</span><strong>Fitness</strong><small>Gym & training</small></button><button type="button" class="business-type-card" data-business-type="freelancer"><span class="business-icon">FR</span><strong>Freelancer</strong><small>Independent work</small></button><button type="button" class="business-type-card" data-business-type="other"><span class="business-icon">MX</span><strong>Other</strong><small>Customize your business</small></button></div><div id="businessTypeError" class="form-error"></div><button id="continueBusinessBtn" class="setup-primary-btn">Continue</button></div><div id="detailsStep" class="setup-card" style="display:none"><p class="eyebrow">BUSINESS DETAILS</p><h2>Tell us about your business</h2><p class="muted">These details will appear on your dashboard and bills.</p><div class="form-grid"><label>Business Name<input id="businessName" class="mx-input" type="text" placeholder="Enter business name"></label><label>Owner Name<input id="ownerName" class="mx-input" type="text" placeholder="Enter owner name"></label><label>Phone Number<input id="phoneNumber" class="mx-input" type="tel" maxlength="10" placeholder="10-digit mobile number"></label><label>WhatsApp Number<input id="whatsappNumber" class="mx-input" type="tel" maxlength="10" placeholder="WhatsApp number"></label><label class="full">Business Address<textarea id="businessAddress" class="mx-input mx-textarea" placeholder="Enter business address"></textarea></label><label>GSTIN<input id="gstin" class="mx-input" maxlength="15" placeholder="Optional"></label><label>Tagline<input id="tagline" class="mx-input" placeholder="Optional tagline"></label></div><div id="profileError" class="form-error"></div><div class="form-actions"><button id="backToBusinessBtn" class="secondary-btn">Back</button><button id="finishSetupBtn" class="setup-primary-btn">Create Business</button></div></div></section>
<section id="mainApp" style="display:none"><header class="app-header"><div class="header-brand"><div class="mx-logo small">M</div><div><strong id="headerBusinessName">ManageX</strong><small id="headerBusinessType">Business Manager</small></div></div><button id="notificationBtn" class="header-icon" aria-label="Notifications"><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg></button></header>
<main class="main-content"><section id="homePage" class="app-page"></section><section id="ordersPage" class="app-page" style="display:none"></section><section id="customersPage" class="app-page" style="display:none"></section><section id="productsPage" class="app-page" style="display:none"></section><section id="settingsPage" class="app-page" style="display:none"></section><section id="profilePage" class="app-page" style="display:none"></section><section id="newOrderPage" class="app-page" style="display:none"></section><section id="billPage" class="app-page" style="display:none"></section></main>
<nav class="bottom-navigation"><button class="nav-item active" data-page="homePage"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></button><button class="nav-item" data-page="ordersPage"><svg viewBox="0 0 24 24"><path d="M6 3h12v18H6zM9 7h6M9 11h6M9 15h4"/></svg><span>Orders</span></button><button class="nav-item nav-main" data-page="newOrderPage"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>New Order</span></button><button class="nav-item" data-page="customersPage"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 2.5-5 6-5s6 2 6 5M17 11a3 3 0 1 0 0-6M16 15c3 .1 5 1.8 5 5"/></svg><span>Customers</span></button><button class="nav-item" data-page="settingsPage"><svg viewBox="0 0 24 24"><path d="M12 15.5A3.5 3.5 0 1 0 12 8a3.5 3.5 0 0 0 0 7.5Z"/><path d="m19.4 15 .1.1-1.8 3.1-.2-.1a2 2 0 0 0-2.7.7l-.1.2H9.3l-.1-.2a2 2 0 0 0-2.7-.7l-.2.1-1.8-3.1.1-.1a2 2 0 0 0 0-3L4.5 12l1.8-3.1.2.1a2 2 0 0 0 2.7-.7l.1-.2h5.4l.1.2a2 2 0 0 0 2.7.7l.2-.1 1.8 3.1-.1.1a2 2 0 0 0 0 3Z"/></svg><span>Settings</span></button></nav></section><div id="managexToast" class="managex-toast"></div><script src="app.js"></script></body></html>
